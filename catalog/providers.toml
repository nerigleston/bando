# Alternativa: ANTHROPIC_FOUNDRY_BASE_URL=https://{resource}.services.ai.azure.com/anthropic.
# Sem chave => usa Entra ID (az login). Foundry não tem checagem de modelo na inicialização: sem pin, falha se o default

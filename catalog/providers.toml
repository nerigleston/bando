[providers.google-gemini.for.crush]
env = { GEMINI_API_KEY = "keychain:bando/google-gemini" }

[providers.google-gemini.for.qwen]
env = { GEMINI_API_KEY = "keychain:bando/google-gemini" }

[providers.google-gemini.for.aider]

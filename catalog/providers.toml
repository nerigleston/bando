[providers.openai]
name   = "OpenAI"
models = ["gpt-6.1-terra", "gpt-6.1-sol", "gpt-6-astra"]

[providers.openai.for.codex]
env = { OPENAI_API_KEY = "keychain:bando/openai" }

[providers.openai.for.opencode]

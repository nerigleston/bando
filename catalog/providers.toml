[providers.xai.for.opencode]
env = { XAI_API_KEY = "keychain:bando/xai" }

[providers.xai.for.crush]
env = { XAI_API_KEY = "keychain:bando/xai" }

[providers.xai.for.aider]
env = { XAI_API_KEY = "keychain:bando/xai" }

[providers.xai.for.goose]
env = { GOOSE_PROVIDER = "xai", XAI_API_KEY = "keychain:bando/xai" }



name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "doc/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "doc/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]

# Máquinas macOS são poucas: um commit novo cancela o CI anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # SwiftTerm 1.99 exige Swift 6.2+; usa o Xcode mais novo da máquina.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Versão do Swift
        run: swift --version
      - name: Catálogo e Presets.swift em dia
        run: python3 -I scripts/gen-presets.py --check
      - name: Diagnóstico dos testes (temporário)
        timeout-minutes: 20
        run: scripts/ci-diag-tests.sh
      - name: Testes
        timeout-minutes: 10
        run: scripts/test.sh
      - name: Monta o app (sem assinatura de distribuição)
        run: scripts/build-app.sh

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "doc/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "doc/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]

# Máquinas macOS são poucas: um commit novo cancela o CI anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # SwiftTerm 1.99 exige Swift 6.2+; usa o Xcode mais novo da máquina.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Cache do .build: as dependências (SwiftTerm, GRDB, Sparkle...) só
      # recompilam quando o Package.resolved ou o Swift mudam.
      - name: Versão do Swift
        id: swift
        run: |
          swift --version
          echo "key=$(swift --version 2>&1 | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-ci-${{ runner.arch }}-${{ steps.swift.outputs.key }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-ci-${{ runner.arch }}-${{ steps.swift.outputs.key }}-
      - name: Catálogo e Presets.swift em dia
        run: python3 -I scripts/gen-presets.py --check
      - name: Testes
        timeout-minutes: 10
        run: scripts/test.sh
      - name: Monta o app (sem assinatura de distribuição)
        run: scripts/build-app.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # SwiftTerm 1.99 exige Swift 6.2+; usa o Xcode mais novo da máquina.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Versão do Swift
        run: swift --version
      - name: Catálogo e Presets.swift em dia
        run: python3 -I scripts/gen-presets.py --check
      - name: Testes
        run: scripts/test.sh
      - name: Monta o app (sem assinatura de distribuição)
        run: scripts/build-app.sh

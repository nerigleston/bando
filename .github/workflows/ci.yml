name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Catálogo e Presets.swift em dia
        run: python3 -I scripts/gen-presets.py --check
      - name: Testes
        run: scripts/test.sh
      - name: Monta o app (sem assinatura de distribuição)
        run: scripts/build-app.sh

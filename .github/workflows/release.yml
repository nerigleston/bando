# Publica uma versão a partir de uma tag.
#
#   git tag v0.3.0 && git push --tags          → canal estável
#   git tag v0.4.0-beta.1 && git push --tags   → canal beta
#
# Gera Bando.app universal, assina, notariza (se houver credenciais), publica
# o Release no GitHub e atualiza appcast.xml e o catálogo assinado no GitHub
# Pages. Os apps instalados veem a versão nova na próxima checagem (até 1 h).
#
# Secrets do repositório:
#   SPARKLE_ED_PRIVATE_KEY       chave privada EdDSA (generate_keys -x arquivo)
#   DEVELOPER_ID_P12             certificado Developer ID em base64   (opcional)
#   DEVELOPER_ID_P12_PASSWORD                                         (opcional)
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD (senha de app)   (opcional)
# Variáveis do repositório:
#   SPARKLE_ED_PUBLIC_KEY        chave pública (vai no Info.plist)
#   BANDO_PAGES_URL              ex.: https://nerigleston.github.io/bando

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SPARKLE_VERSION: "2.10.1"
  HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' }}

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versão a partir da tag
        id: v
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BUILD="$(git rev-list --count HEAD)"
          CHANNEL=""
          case "$VERSION" in *-*) CHANNEL="beta";; esac
          sed -i '' "s/current = \".*\"/current = \"${VERSION}\"/" Sources/BandoCore/Version.swift
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Catálogo em dia e testes
        run: |
          python3 -I scripts/gen-presets.py --check
          scripts/test.sh

      - name: Certificado Developer ID
        id: cert
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "Sem certificado: assinatura ad hoc (o macOS vai avisar na primeira instalação)."
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')"
          echo "identity=$ID" >> "$GITHUB_OUTPUT"

      - name: Monta Bando.app
        env:
          BANDO_VERSION: ${{ steps.v.outputs.version }}
          BANDO_BUILD: ${{ steps.v.outputs.build }}
          BANDO_FEED_URL: ${{ vars.BANDO_PAGES_URL }}/appcast.xml
          BANDO_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          BANDO_SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
          BANDO_UNIVERSAL: "1"
        run: scripts/build-app.sh

      - name: Notariza
        if: steps.cert.outputs.identity != '-' && env.HAS_NOTARY == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent build/Bando.app build/notarize.zip
          xcrun notarytool submit build/notarize.zip --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple build/Bando.app

      - name: Pacotes
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Bando.app "dist/Bando-${{ steps.v.outputs.version }}.zip"
          hdiutil create -volname Bando -srcfolder build/Bando.app -ov -format UDZO \
            "dist/Bando-${{ steps.v.outputs.version }}.dmg"

      - name: Ferramentas do Sparkle
        run: |
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle && tar -xf sparkle.tar.xz -C sparkle

      - name: Appcast e catálogo assinados
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          KEY="$RUNNER_TEMP/ed.key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY"
          # Traz o appcast atual do gh-pages para acrescentar a versão nova.
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          mkdir -p pages
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
            git --work-tree=pages checkout gh-pages -- . 2>/dev/null || true
          fi
          mkdir -p pages/updates pages/catalog
          cp "dist/Bando-${{ steps.v.outputs.version }}.zip" pages/updates/
          # Notas da versão: seção da versão no CHANGELOG.md, se existir.
          if [ -f CHANGELOG.md ]; then
            awk "/^## \\[?${{ steps.v.outputs.version }}/{f=1;next} /^## /{f=0} f" CHANGELOG.md \
              > "pages/updates/Bando-${{ steps.v.outputs.version }}.md"
          fi
          CHANNEL_ARGS=()
          [ -n "${{ steps.v.outputs.channel }}" ] && CHANNEL_ARGS=(--channel "${{ steps.v.outputs.channel }}")
          ./sparkle/bin/generate_appcast --ed-key-file "$KEY" \
            --download-url-prefix "${{ vars.BANDO_PAGES_URL }}/updates/" \
            --embed-release-notes "${CHANNEL_ARGS[@]+"${CHANNEL_ARGS[@]}"}" \
            -o pages/appcast.xml pages/updates
          # Catálogo de agentes e providers (seção 17.2 do plano).
          cp catalog/agents.toml catalog/providers.toml pages/catalog/
          python3 -I scripts/catalog-manifest.py pages/catalog "$KEY" ./sparkle/bin/sign_update \
            "${{ steps.v.outputs.version }}" > pages/catalog/catalog.json
          rm -f "$KEY"

      - name: Publica no GitHub Pages
        run: |
          cd pages
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="bando-release" -c user.email="bando-release@users.noreply.github.com" \
            commit -q -m "Release ${{ steps.v.outputs.version }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          [ -n "${{ steps.v.outputs.channel }}" ] && PRE="--prerelease"
          NOTES="pages/updates/Bando-${{ steps.v.outputs.version }}.md"
          [ -s "$NOTES" ] || echo "Versão ${{ steps.v.outputs.version }}" > "$NOTES"
          gh release create "$GITHUB_REF_NAME" dist/* $PRE \
            --title "Bando ${{ steps.v.outputs.version }}" --notes-file "$NOTES"
